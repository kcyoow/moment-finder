<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moment finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f2; --panel:#f7f8f9; --panel2:#ffffff; --sunk:#e9ebee;
  --line:#d3d7dd; --line2:#e3e6ea;
  --ink:#14171c; --ink2:#454d58; --ink3:#77808c; --ink4:#a4abb5;
  --viewer:#0b0c0e; --viewer-ink:#e8eaee; --viewer-ink2:#98a0ab; --viewer-line:#24272d;
  --mark:#c47d0a; --mark-ink:#1b1200; --mark-soft:rgba(196,125,10,.16);
  --series:#2a78d6; --series-rgb:42,120,214;
  --good:#1c8048; --warn:#b06d00; --bad:#c23b2e;
  --shadow:0 10px 30px rgba(18,22,30,.16),0 1px 3px rgba(18,22,30,.12);
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0f1013; --panel:#17191d; --panel2:#1d2025; --sunk:#131417;
  --line:#2b2f36; --line2:#22252b;
  --ink:#e8eaee; --ink2:#a8aeb9; --ink3:#747b87; --ink4:#535964;
  --viewer:#060708; --viewer-line:#1d2025;
  --mark:#c4830c; --mark-ink:#140d00; --mark-soft:rgba(196,131,12,.24);
  --series:#3987e5; --series-rgb:57,135,229;
  --good:#3fb574; --warn:#d59a2a; --bad:#e5604d;
  --shadow:0 12px 34px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1013; --panel:#17191d; --panel2:#1d2025; --sunk:#131417;
  --line:#2b2f36; --line2:#22252b;
  --ink:#e8eaee; --ink2:#a8aeb9; --ink3:#747b87; --ink4:#535964;
  --viewer:#060708; --viewer-line:#1d2025;
  --mark:#c4830c; --mark-ink:#140d00; --mark-soft:rgba(196,131,12,.24);
  --series:#3987e5; --series-rgb:57,135,229;
  --good:#3fb574; --warn:#d59a2a; --bad:#e5604d;
  --shadow:0 12px 34px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--series);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lab{font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--ink3)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 틀 ---------- */
.app{display:grid;grid-template-rows:46px minmax(0,1fr);height:100dvh}
.bar{display:flex;align-items:center;gap:12px;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel);min-width:0;view-transition-name:bar}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em;font-size:14.5px;white-space:nowrap}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:6px;min-width:0}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border:1px solid var(--line);border-radius:3px;color:var(--ink2);white-space:nowrap}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:5px;color:var(--ink2);transition:background .15s,color .15s;flex:none}
.icon-btn:hover{background:var(--line2);color:var(--ink)}
.busy{display:flex;align-items:center;gap:7px;height:28px;padding:0 11px 0 8px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:500;white-space:nowrap;animation:rise .3s var(--ease)}
.busy i{width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.srv{display:flex;align-items:center;gap:8px;height:28px;padding:0 4px 0 9px;border:1px solid var(--line);border-radius:5px;font-size:12px;color:var(--ink2);white-space:nowrap;min-width:0}
.srv #srvText{overflow:hidden;text-overflow:ellipsis}
.srv .dot{width:7px;height:7px;border-radius:50%;background:var(--ink4);flex:none}
.srv[data-s="warm"] .dot{background:var(--good)}
.srv[data-s="warming"] .dot{background:var(--warn);animation:blink 1.1s ease-in-out infinite}
.srv[data-s="error"] .dot{background:var(--bad)}
.srv button{height:20px;padding:0 7px;border-radius:3px;background:var(--line2);font-size:11.5px;font-weight:500;color:var(--ink);transition:background .15s}
.srv button:hover{background:var(--line)}
.srv .pad{width:5px}
@keyframes blink{50%{opacity:.25}}
.stage{min-width:0;min-height:0;overflow:auto;position:relative}
.rise{animation:rise .46s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* ---------- 메인 화면 ---------- */
.home{padding:clamp(28px,7vh,72px) max(20px,env(safe-area-inset-right,0px)) 72px max(20px,env(safe-area-inset-left,0px))}
.wrap{max-width:820px;margin:0 auto}
.home h1{margin:0 0 8px;font-size:clamp(24px,3.4vw,32px);font-weight:600;letter-spacing:-.025em;line-height:1.25;text-wrap:balance}
.home .sub{margin:0 0 24px;color:var(--ink2);font-size:14.5px;max-width:58ch}
.composer{background:var(--panel2);border:1px solid var(--line);border-radius:10px;transition:border-color .15s,box-shadow .25s;position:relative}
.composer:focus-within{border-color:var(--ink2);box-shadow:0 0 0 3px var(--line2)}
.composer.shake{animation:shake .32s;border-color:var(--bad)}
@keyframes shake{20%{transform:translateX(-5px)}45%{transform:translateX(5px)}70%{transform:translateX(-2px)}}
#req{display:block;width:100%;border:0;background:none;resize:none;outline:none;padding:17px 18px 6px;font-size:16.5px;line-height:1.5;min-height:48px;max-height:180px}
#req::placeholder{color:var(--ink4)}
.composer-bar{display:flex;align-items:center;gap:14px;padding:8px 10px 10px 12px;flex-wrap:wrap}
.pick{height:36px;padding:0 15px 0 11px;border-radius:6px;background:var(--ink);color:var(--bg);font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:transform .12s var(--ease),opacity .15s;white-space:nowrap}
.pick:hover{opacity:.88} .pick:active{transform:scale(.97)}
.composer-bar span{color:var(--ink3);font-size:12.5px;line-height:1.45;flex:1;min-width:200px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;align-items:center}
.chip{font-size:12.5px;padding:3px 10px;border:1px solid var(--line);border-radius:14px;color:var(--ink2);transition:border-color .15s,color .15s,background .15s,transform .12s}
.chip:hover{border-color:var(--ink3);color:var(--ink);background:var(--panel2)} .chip:active{transform:scale(.96)}
.jobs{margin-top:clamp(30px,6vh,52px)}
.jobs-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.jobs-head .count{font-size:11.5px;color:var(--ink3)}
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1.1fr) minmax(150px,.9fr) 14px;gap:16px;align-items:center;width:100%;padding:12px 6px 12px 0;border-bottom:1px solid var(--line2);position:relative;transition:background .15s,padding-left .2s var(--ease)}
.row:hover{background:var(--panel);padding-left:8px}
.row.enter{animation:rowIn .4s var(--ease) both}
@keyframes rowIn{from{opacity:0;transform:translateY(-8px)}}
.row-thumb{position:relative;height:58px;border-radius:4px;overflow:hidden;background:var(--viewer);display:block}
.row-thumb img,.row-thumb canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.row-thumb img{opacity:0;transition:opacity .35s} .row-thumb img.on{opacity:1}
.row-thumb canvas{opacity:0;transition:opacity .12s} .row-thumb.scrub canvas{opacity:1}
.row-thumb u{position:absolute;top:0;bottom:0;width:1px;background:#fff;opacity:0} .row-thumb.scrub u{opacity:.9}
.row.is-run .row-thumb::after{content:"";position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.85;animation:sweep 1.6s linear infinite}
@keyframes sweep{from{left:-2px}to{left:100%}}
.row-title{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-req{display:block;font-size:12.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.row-side{display:grid;gap:6px;min-width:0}
.row-state{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink2);white-space:nowrap}
.row-state span:first-child{overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.row.is-run .row-state span:first-child::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn);animation:blink 1.1s infinite;flex:none}
.row.is-err .row-state{color:var(--bad)}
.row-track{display:block;height:6px;background:var(--line2);position:relative;overflow:hidden;border-radius:1px}
.row-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink);transition:width .7s var(--ease),opacity .4s}
.row.is-done .row-fill{opacity:0}
.row-spans i{position:absolute;top:0;bottom:0;min-width:2px;background:var(--mark);transform:scaleY(0);transition:transform .45s var(--ease)}
.row.is-done .row-spans i{transform:scaleY(1)}
.row-track b{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:0}
.row .chev{color:var(--ink4);transition:transform .2s var(--ease),color .15s} .row:hover .chev{transform:translateX(3px);color:var(--ink)}
.empty{padding:26px 4px;color:var(--ink3);line-height:1.7}
.how{margin:34px 0 0;font-size:12.5px;color:var(--ink3);line-height:1.9}
.how b{font-weight:500;color:var(--ink2)} .how i{font-style:normal;margin:0 7px;color:var(--ink4)}

/* ---------- 한 작업의 화면 ---------- */
.page{max-width:1240px;margin:0 auto;padding:16px max(22px,env(safe-area-inset-right,0px)) 48px max(22px,env(safe-area-inset-left,0px))}
.page.narrow{max-width:900px}
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.back{height:32px;padding:0 12px 0 8px;border:1px solid var(--line);border-radius:6px;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink2);white-space:nowrap;transition:background .15s,color .15s;flex:none}
.back:hover{background:var(--panel2);color:var(--ink)} .back:hover svg{transform:translateX(-2px)} .back svg{transition:transform .2s var(--ease)}
.page-title{min-width:0;flex:1}
.page-title h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere;line-height:1.35}
.page-title p{margin:2px 0 0;color:var(--ink2);font-size:14px;overflow-wrap:anywhere}
.ghost{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s;flex:none}
.ghost:hover{background:var(--panel2);border-color:var(--ink3)}

/* 처리 중 */
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--ink2);margin:8px 0 14px}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--warn);position:relative}
.eyebrow i::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--warn);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.5);opacity:1}to{transform:scale(1.6);opacity:0}}
.meter{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.meter-num{font-size:64px;line-height:.9;font-weight:500;letter-spacing:-.045em}
.meter-num small{font-size:22px;color:var(--ink3);margin-left:3px;letter-spacing:0}
.meter-sub{padding-bottom:2px;min-width:0}
.meter-sub b{display:block;font-weight:600;font-size:15px}
.meter-sub span{display:block;color:var(--ink2);font-size:12.5px;margin-top:1px;min-height:19px}
.scan-strip{position:relative;height:78px;background:var(--viewer);border-radius:5px;overflow:hidden}
.scan-strip canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scan-strip .dim{filter:grayscale(1) brightness(.4)}
.scan-strip .lit{clip-path:inset(0 100% 0 0);transition:clip-path .9s linear}
.scan-line{position:absolute;top:0;bottom:0;left:0;width:2px;background:#fff;transition:left .9s linear;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.scan-strip.wait .scan-line{animation:blink 1.1s infinite}
.scan-strip.none::after,.film.load::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0,rgba(255,255,255,.08) 50%,transparent 100%);background-size:40% 100%;background-repeat:no-repeat;animation:shim 1.5s linear infinite}
@keyframes shim{from{background-position:-40% 0}to{background-position:140% 0}}
canvas.ruler{display:block;width:100%;height:20px}
.steps{list-style:none;margin:20px 0 0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0}
.steps li{position:relative;padding:16px 8px 0 0;color:var(--ink3);transition:color .25s;min-width:0}
.steps li::before{content:"";position:absolute;left:0;right:0;top:4px;height:1px;background:var(--line)}
.steps li::after{content:"";position:absolute;left:0;right:0;top:4px;height:1px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.steps li.done::after{transform:scaleX(1)}
.steps li.doing::after{transform:scaleX(.5);animation:half 1.6s ease-in-out infinite}
@keyframes half{50%{transform:scaleX(.82)}}
.steps .mk{position:absolute;left:0;top:0;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid var(--ink4);z-index:1;transition:background .25s,border-color .25s,transform .3s var(--ease)}
.steps li.done{color:var(--ink2)} .steps li.done .mk{background:var(--ink);border-color:var(--ink)}
.steps li.doing{color:var(--ink)} .steps li.doing .mk{border-color:var(--ink);background:var(--ink);transform:scale(1.25)}
.steps li.error{color:var(--bad)} .steps li.error .mk{border-color:var(--bad);background:var(--bad)}
.steps b{display:block;font-weight:500;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps time{font-family:var(--mono);font-size:11px;color:var(--ink3);display:block;min-height:16px}
.qp{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
.qp-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.qp-head .who{font-size:12px;color:var(--ink3)}
.und{margin:0 0 10px;line-height:1.65;color:var(--ink2);max-width:70ch}
.sq{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px;align-items:center;font-size:12px;color:var(--ink3)}
.sq code{font-family:var(--mono);font-size:11px;padding:2px 6px;background:var(--sunk);border:1px solid var(--line2);border-radius:3px;color:var(--ink2)}
.qcard{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:4px 16px;padding:8px 0;border-top:1px solid var(--line2)}
.qcard.in{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*90ms)}
.qkey{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;font-weight:500;min-width:0;flex-wrap:wrap}
.tag{font-family:var(--sans);font-size:10.5px;font-weight:500;padding:0 5px;border:1px solid var(--line);border-radius:2px;color:var(--ink3);white-space:nowrap}
.qtext{margin:0;color:var(--ink2);line-height:1.5;font-size:12.5px}
.sk{height:11px;border-radius:2px;background:linear-gradient(90deg,var(--line2) 25%,var(--line) 37%,var(--line2) 63%);background-size:300% 100%;animation:sk 1.4s linear infinite;margin:10px 0}
@keyframes sk{from{background-position:100% 0}to{background-position:0 0}}
.errbox{margin:0 0 18px;padding:14px 16px;border:1px solid var(--bad);border-radius:6px;background:var(--panel)}
.errbox b{color:var(--bad)} .errbox pre{margin:8px 0 0;font:11.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink2)}

/* 결과 */
.result{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:18px;align-items:start}
.deck{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);min-width:0}
.screen{position:relative;height:clamp(220px,calc(100dvh - 400px),640px);background:var(--viewer);overflow:hidden;cursor:pointer;view-transition-name:hero}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:var(--viewer)}
.screen-tag{position:absolute;left:12px;top:12px;font-size:11.5px;font-weight:500;padding:3px 8px;background:var(--mark);color:var(--mark-ink);border-radius:2px;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s;pointer-events:none}
.screen-tag.on{opacity:1;transform:none}
.screen-tag.low{background:var(--panel2);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.screen-note{position:absolute;left:12px;bottom:10px;font-size:11.5px;color:var(--viewer-ink2);background:rgba(0,0,0,.6);padding:2px 7px;border-radius:2px}
.bigplay{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(10,11,13,.72);display:grid;place-items:center;transition:opacity .2s,transform .2s var(--ease);border:1px solid rgba(255,255,255,.22)}
.bigplay svg{width:22px;height:22px;fill:#fff;margin-left:3px}
.screen:hover .bigplay{transform:scale(1.06)}
.screen.playing .bigplay{opacity:0;transform:scale(.8);pointer-events:none}
.transport{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--viewer);border-top:1px solid var(--viewer-line);color:var(--viewer-ink);min-width:0}
.tb{width:32px;height:32px;display:grid;place-items:center;border-radius:5px;color:var(--viewer-ink);transition:background .15s;flex:none}
.tb:hover{background:rgba(255,255,255,.1)}
.tb svg{fill:currentColor;stroke:none;width:15px;height:15px}
.tb.line svg{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.tc{margin-left:8px;font-size:13px;white-space:nowrap;color:var(--viewer-ink2)}
.tc b{font-weight:500;color:var(--viewer-ink)}
.grow{flex:1}
.tgl{height:28px;padding:0 11px;border:1px solid rgba(255,255,255,.22);border-radius:4px;font-size:12.5px;color:var(--viewer-ink);white-space:nowrap;display:flex;align-items:center;gap:7px;transition:background .15s,border-color .15s,color .15s}
.tgl:hover{border-color:rgba(255,255,255,.5)}
.tgl i{width:8px;height:8px;border-radius:1px;background:currentColor;opacity:.45;transition:opacity .15s}
.tgl[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:var(--mark-ink);font-weight:500}
.tgl[aria-pressed="true"] i{opacity:1}
.rate{width:38px;height:28px;border-radius:4px;font-size:12px;text-align:center;color:var(--viewer-ink)}
.rate:hover{background:rgba(255,255,255,.1)}
.tl{position:relative;padding:8px 12px 6px}
.tracks{position:relative;cursor:crosshair;touch-action:none;user-select:none}
.tracks canvas{display:block;width:100%}
.film{height:44px;background:var(--viewer);border-radius:3px;position:relative;overflow:hidden}
.film canvas{height:44px}
.cliptrack{position:relative;height:24px;margin-top:4px;background:var(--sunk);border-radius:2px}
.cb{position:absolute;top:2px;bottom:2px;min-width:14px;background:var(--mark);color:var(--mark-ink);border-radius:2px;font:600 11px/20px var(--mono);text-align:left;padding-left:5px;overflow:hidden;transform-origin:bottom;transition:filter .12s,box-shadow .12s;animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(560ms + var(--i,0)*80ms)}
@keyframes pop{from{transform:scaleY(0);opacity:0}}
.cb:hover,.cb.hl{filter:brightness(1.12);box-shadow:0 0 0 1px var(--ink)}
.cb.on{box-shadow:0 0 0 1.5px var(--ink)}

.cb.low:hover,.cb.low.hl{filter:none;box-shadow:inset 0 0 0 1px var(--ink)}
.cb.low.on{box-shadow:inset 0 0 0 1.5px var(--ink)}
.scorewrap{margin-top:4px}

.qtracks{position:relative;overflow:hidden;height:0;opacity:0;transition:height .32s var(--ease),opacity .25s,margin .3s}
.qtracks.open{opacity:1;margin-top:4px}
.qtracks span{position:absolute;left:4px;font:500 10.5px/14px var(--mono);color:var(--ink);background:color-mix(in srgb,var(--panel) 82%,transparent);padding:0 4px;border-radius:2px;pointer-events:none;white-space:nowrap}
.reelveil i{position:absolute;top:20px;bottom:0;background:var(--panel);opacity:0;transition:opacity .3s;pointer-events:none}
.tl.reel .reelveil i{opacity:.7}
.hoverline{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--ink3);pointer-events:none;opacity:0}
.playhead{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);pointer-events:none;will-change:left}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:5.5px solid transparent;border-top:7px solid var(--ink);border-bottom:0}
.tl-foot{display:flex;align-items:center;gap:14px;padding:8px 0 2px;font-size:12px;color:var(--ink3);flex-wrap:wrap}
.tl-foot .key{display:inline-flex;align-items:center;gap:6px}
.tl-foot .key i{width:12px;height:8px;background:var(--mark);border-radius:1px}
.tl-foot .key u{width:14px;height:0;border-top:2px solid var(--series);text-decoration:none}
.tl-foot .key s{width:12px;height:8px;box-shadow:inset 0 0 0 1px var(--ink4);border-radius:1px;text-decoration:none}
.link{font-size:12px;color:var(--ink2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;transition:color .15s,text-decoration-color .15s;margin-left:auto}
.link:hover{color:var(--ink);text-decoration-color:var(--ink)}
.tip{position:absolute;z-index:20;bottom:calc(100% + 4px);width:200px;padding:8px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);pointer-events:none;font-size:11.5px}
.tip canvas{display:block;width:100%;border-radius:3px;background:var(--viewer);margin-bottom:7px}
.tip-top{display:flex;justify-content:space-between;align-items:baseline}
.tip-top>b{font-family:var(--mono);font-size:13px;font-weight:600}
.tip-top span{color:var(--ink2)} .tip-top span b{font-size:12px;color:var(--ink)}
.tip-q{display:grid;grid-template-columns:minmax(0,1fr) 44px 30px;gap:3px 6px;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--ink2);margin-top:6px}
.tip-q span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tip-q u{display:block;height:5px;background:var(--line2);border-radius:1px;overflow:hidden;text-decoration:none}
.tip-q u i{display:block;height:100%;background:var(--series)}
.tip-q em{font-style:normal;text-align:right;color:var(--ink)}
.tip-c{margin-top:6px;padding-top:6px;border-top:1px solid var(--line2);color:var(--ink2)}
.tip-c b{display:inline-block;width:8px;height:8px;background:var(--mark);border-radius:1px;margin-right:6px}

.side{min-width:0}
.side-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 0 8px}
.side-head h2{margin:0;font-size:15px;font-weight:600}
.side-head h2 span{font-weight:400;color:var(--ink3);font-size:12px;margin-left:7px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;font-size:12px;flex:none}
.seg button{padding:2px 9px;color:var(--ink3);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cbody{display:grid;gap:6px}
.crow{display:grid;grid-template-columns:20px 92px minmax(0,1fr);gap:11px;align-items:center;width:100%;padding:7px 9px 7px 8px;border:1px solid var(--line2);border-radius:7px;background:var(--panel);position:relative;overflow:hidden;cursor:pointer;transition:border-color .15s,background .15s,transform .15s var(--ease)}
.crow:hover,.crow.hl{border-color:var(--ink3);transform:translateX(-2px)}
.crow.on{border-color:var(--mark);background:var(--panel2)}
.crow .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--mark);width:0}
.rk{font-family:var(--mono);font-weight:600;font-size:13px;text-align:center}
.cth{position:relative;width:92px;height:52px;border-radius:4px;overflow:hidden;background:var(--viewer);display:block}
.cth img,.cth canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cth canvas{opacity:0;transition:opacity .12s} .cth.scrub canvas{opacity:1}
.cth u{position:absolute;top:0;bottom:0;width:1px;background:#fff;opacity:0} .cth.scrub u{opacity:.9}
.crange{font-family:var(--mono);font-size:13px;font-weight:500;white-space:nowrap;display:block}
.cmeta{display:block;font-size:12px;color:var(--ink3);margin-top:1px}
.cwhy{display:flex;flex-wrap:wrap;gap:3px 4px;margin-top:5px}
.cwhy span{font-family:var(--mono);font-size:10.5px;color:var(--ink2);padding:0 5px;background:var(--sunk);border-radius:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl{position:absolute;right:6px;top:6px;width:24px;height:24px;display:grid;place-items:center;border-radius:4px;color:var(--ink3);opacity:0;transition:opacity .15s,background .15s}
.crow:hover .dl,.dl:focus-visible{opacity:1} .dl:hover{background:var(--line);color:var(--ink)}
.side-note{margin:12px 2px 0;font-size:12px;color:var(--ink3);line-height:1.6}
/* 다시 확인(README 22절): 확인을 통과한 클립과 낮게 나온 후보 */
.crow.low{background:transparent;border-style:dashed}
.crow.low .cth{opacity:.6;filter:saturate(.5)} .crow.low .rk,.crow.low .crange{color:var(--ink3)}
.crow.low.on{border-color:var(--ink3);border-style:solid} .crow.low .prog{background:var(--ink3)}
.cchk{display:inline-flex;align-items:center;gap:5px;margin-left:8px;font-family:var(--mono);font-size:11px;color:var(--ink2)}
.cchk i{width:26px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--mark) calc(var(--p)*100%),var(--line) 0)}
.crow.low .cchk i{background:linear-gradient(90deg,var(--ink4) calc(var(--p)*100%),var(--line) 0)}
.csee{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.45;color:var(--ink2);margin-top:4px}
.cdiv{display:flex;align-items:center;gap:10px;margin:8px 2px 0;font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--ink3)}
.cdiv::after{content:"";flex:1;height:1px;background:var(--line)}
.none-note{padding:13px 14px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);margin-bottom:10px}
.none-note b{display:block;font-size:14px;font-weight:600;margin-bottom:4px} .none-note p{margin:0;font-size:12.5px;line-height:1.6;color:var(--ink2)}
.vlist{display:grid;gap:6px}
.vrow{display:grid;grid-template-columns:88px minmax(0,1fr) 34px;gap:4px 10px;align-items:center;padding:9px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);transition:border-color .15s}
.vrow:hover{border-color:var(--ink3)} .vrow u{height:4px;border-radius:2px;background:var(--line);text-decoration:none;overflow:hidden} .vrow u i{display:block;height:100%;background:var(--mark)}
.vrow.low u i{background:var(--ink4)} .vrow em{font-style:normal;font-size:12px;text-align:right}
.vrow p{grid-column:1/-1;margin:2px 0 0;font-size:12.5px;line-height:1.55;color:var(--ink2)} .vrow small{grid-column:1/-1;font-size:11px;color:var(--ink3)}

/* 근거 (옆에서 열린다) */
.scrim{position:fixed;inset:46px 0 0 0;background:rgba(8,9,11,.34);opacity:0;pointer-events:none;transition:opacity .25s;z-index:29}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:46px;right:0;bottom:0;width:min(452px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(104%);visibility:hidden;transition:transform .36s var(--ease),visibility 0s .36s;z-index:30;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.drawer.open{transform:none;visibility:visible;transition:transform .36s var(--ease),visibility 0s}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 4px 18px}
.drawer-head h2{margin:0;font-size:15px;font-weight:600}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);position:relative}
.tabs button{padding:8px 8px 9px;font-weight:500;color:var(--ink3);display:flex;gap:6px;align-items:baseline;transition:color .15s}
.tabs button span{font-family:var(--mono);font-size:11px}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tab-ink{position:absolute;bottom:-1px;height:2px;background:var(--ink);transition:left .28s var(--ease),width .28s var(--ease)}
.panes{min-height:0;position:relative}
.pane{position:absolute;inset:0;overflow:auto}
.pane.show{animation:paneIn .22s var(--ease)}
@keyframes paneIn{from{opacity:0;transform:translateY(4px)}}
.sec{padding:14px 18px;border-bottom:1px solid var(--line2)}
.sec>.lab{display:block;margin-bottom:6px}
.sec p{margin:0;line-height:1.65;color:var(--ink2)}
.thead{display:grid;position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line2);font-size:11.5px;font-weight:600;color:var(--ink3);padding:7px 18px;user-select:none}
.thead button{font-weight:600;display:inline-flex;align-items:center;gap:2px;transition:color .15s}
.thead button:hover{color:var(--ink)}
.thead .ar{display:inline-block;width:10px;opacity:0;transition:opacity .15s,transform .2s}
.thead .sorted{color:var(--ink)} .thead .sorted .ar{opacity:1} .thead .asc .ar{transform:rotate(180deg)}
.qg{grid-template-columns:minmax(0,1fr) 44px 44px 50px;gap:8px;align-items:start}
.qrow{display:grid;width:100%;padding:11px 18px;border-bottom:1px solid var(--line2);transition:background .12s;cursor:pointer}
.qrow:hover{background:var(--sunk)}
.qrow canvas{display:block;width:100%;height:22px;margin-top:7px}
.qrow .n{text-align:right;font-family:var(--mono);font-size:12px;padding-top:1px}
.qrow .qtext{margin-top:3px}
.qmore{grid-column:1/-1;display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease)}
.qmore>div{overflow:hidden}
.qrow.open .qmore{grid-template-rows:1fr}
.crit{margin:8px 0 0;padding:0;list-style:none;font-size:12px;line-height:1.5;color:var(--ink2)}
.crit li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:3px 0}
.crit li b{font-family:var(--mono);font-weight:500;color:var(--ink3)}
.kv{display:grid;grid-template-columns:108px minmax(0,1fr);gap:5px 12px;margin:0;font-size:12.5px}
.kv dt{color:var(--ink3)} .kv dd{margin:0;overflow-wrap:anywhere}
.durs{display:grid;gap:5px;font-size:12.5px}
.durs div{display:grid;grid-template-columns:118px minmax(0,1fr) 46px;gap:8px;align-items:center}
.durs i{display:block;height:6px;background:var(--ink2);border-radius:0 2px 2px 0;transform-origin:left;animation:growx .6s var(--ease) both}
@keyframes growx{from{transform:scaleX(0)}}
.durs span:last-child{text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--ink2)}

/* 떠 있는 것 */
.veil{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);display:grid;place-items:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.veil-box{width:min(560px,82vw);padding:46px 30px;text-align:center;position:relative;background:var(--panel2);border-radius:10px}
.veil-box svg.ants{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.veil-box svg.ants rect{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:8 6;animation:ants .6s linear infinite}
@keyframes ants{to{stroke-dashoffset:-14}}
.veil-box b{display:block;font-size:20px;font-weight:600;margin-bottom:6px}
.veil-box span{color:var(--ink2)}
.toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:grid;gap:8px;justify-items:end}
.toast{padding:10px 14px;background:var(--ink);color:var(--bg);border-radius:6px;font-size:13px;box-shadow:var(--shadow);animation:toastIn .3s var(--ease);max-width:400px;text-align:left}
.toast.act{cursor:pointer} .toast.act::after{content:"  보기 →";font-weight:600;white-space:pre}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
.toast.bad{background:var(--bad);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}}
.pop{position:fixed;right:12px;top:52px;z-index:40;width:260px;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);animation:paneIn .18s var(--ease)}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:8px 0 0;font-size:12px}
.pop dt{font-family:var(--mono);font-size:11px;color:var(--ink2);white-space:nowrap} .pop dd{margin:0;color:var(--ink2)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.28s}
::view-transition-group(hero){animation-duration:.42s;animation-timing-function:cubic-bezier(.2,.7,.2,1)}

/* ---------- 좁은 화면 ---------- */
@media (max-width:900px){
  .result{grid-template-columns:minmax(0,1fr)}
  .screen{height:clamp(200px,48vh,460px)}
  .steps{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:14px}
}
@media (max-width:640px){
  .row{grid-template-columns:84px minmax(0,1fr);gap:8px 12px}
  .row-thumb{height:48px} .row-side{grid-column:1/-1} .row .chev{display:none}
  .qcard{grid-template-columns:minmax(0,1fr)}
  .srv #srvText{max-width:96px} .tc{font-size:12px;margin-left:4px} .tgl{padding:0 8px}
  .page-head{flex-wrap:wrap} .page-title{flex-basis:100%;order:3}
  .back{margin-right:auto}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }
/* 주소에 ?still을 붙이면 움직임 없이 다 그려진 모습으로 연다(화면 그림을 찍을 때 쓴다) */
html.still *,html.still *::before,html.still *::after{animation:none!important;transition:none!important}
</style>

const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const ICON = {

  mute: '<svg viewBox="0 0 16 16"><path d="M2.5 6h2.3L8 3.2v9.6L4.8 10H2.5z" fill="currentColor" stroke="none"/><path d="m10.6 6 3.6 4M14.2 6l-3.6 4"/></svg>',

};
function toast(text, bad, act) {

  tracks.addEventListener("pointermove", e => { hover(e); if (drag) seek(tAt(e)); });
  tracks.addEventListener("pointerdown", e => { if (e.button) return; const b = e.target.closest(".cb"); if (b) { const c = clips.find(c => c.rank === +b.dataset.r); seek(c.start, true); return; } drag = true; tracks.setPointerCapture(e.pointerId); seek(tAt(e)); });
  const endDrag = () => { drag = false; };
  tracks.addEventListener("pointerup", endDrag); tracks.addEventListener("pointercancel", endDrag);
  tracks.addEventListener("pointerleave", () => { tip.hidden = true; hline.style.opacity = 0; $$(".hl", st).forEach(x => x.classList.remove("hl")); });

  /* ----- 고른 클립 ----- */
  const cbody = $("#cbody", st);
  const crows = new Map(clips.map((c, i) => {
    const r = document.createElement("div"); r.className = "crow rise" + (isHit(c) ? "" : " low"); r.dataset.r = c.rank; r.style.setProperty("--i", i + 3); r.tabIndex = 0; r.setAttribute("role", "button");
    r.innerHTML = `<span class="rk">${c.rank}</span><span class="cth"><img alt="" loading="lazy" src="${c.poster}"><canvas></canvas><u></u></span>
      <span style="min-width:0"><span class="crange">${ms(c.start)} – ${ms(c.end)}</span>${c.p != null
        ? `<span class="cmeta">${Math.round(c.length)}초<span class="cchk" title="${vWho} 프레임을 보고 매긴, 요청한 장면이 담겼을 확률"><i style="--p:${c.p}"></i>확인 ${c.p.toFixed(2)}</span></span><span class="csee" title="${esc(c.see)}">${esc(c.see)}</span><span class="cwhy"><span title="이 후보가 나온 목록">${esc(c.from)}</span></span>`
        : `<span class="cmeta">${Math.round(c.length)}초 · 점수 ${c.peak.toFixed(2)}</span><span class="cwhy">${(c.why || []).map(w => `<span title="이 구간에서 이 질문의 답이 높았습니다">${esc(w[0])}</span>`).join("")}</span>`}</span>
      ${c.url ? `<a class="dl" href="${c.url}" download title="이 클립 파일 받기" aria-label="클립 ${c.rank} 받기">${ICON.dl}</a>` : ""}<i class="prog"></i>`;
    r.onclick = e => { if (e.target.closest(".dl")) return; seek(c.start, true); };
    r.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); seek(c.start, true); } };
    r.onmouseenter = () => $(`.cb[data-r="${c.rank}"]`, st)?.classList.add("hl"); r.onmouseleave = () => $(`.cb[data-r="${c.rank}"]`, st)?.classList.remove("hl");
    scrubber($(".cth", r), () => d.strip, () => [c.start, c.end]);
    return [c.rank, r];
  }));
  const cdiv = document.createElement("div"); cdiv.className = "cdiv"; cdiv.textContent = `확인에서 낮게 나온 후보 ${lows.length}개`;
  function sortClips(k, animate) {
    const list = [...clips].sort((a, b) => a[k] - b[k]);
    $$("#seg button", st).forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k));
    const place = () => { list.filter(isHit).forEach(c => cbody.append(crows.get(c.rank))); if (lows.length) { cbody.append(cdiv); list.filter(c => !isHit(c)).forEach(c => cbody.append(crows.get(c.rank))); } };
    animate ? flip(cbody, place) : place();
  }
  $("#seg", st).onclick = e => { const b = e.target.closest("button"); if (!b) return; $$(".crow", st).forEach(r => r.classList.remove("rise")); sortClips(b.dataset.k, true); };
  sortClips("rank", false);

  /* ----- 근거: 질문 ----- */
  const pq = $('.pane[data-p="qs"]', st), wr = d.writer || {};
  pq.innerHTML = `<div class="sec"><span class="lab">${wr.understanding ? "질문을 쓴 LLM이 이해한 것" : "질문을 쓴 쪽"}</span><p>${esc(wr.understanding || wr.model || "기록이 없습니다")}</p>${wr.understanding ? `<div style="margin-top:9px">${searchLine(wr)}</div>` : ""}</div>
    <div class="thead qg"><span>판정 모델에 물은 질문</span><button data-k="mean" style="justify-self:end">평균${ICON.ar}</button><button data-k="peak" style="justify-self:end">최고${ICON.ar}</button><button data-k="yes_seconds" style="justify-self:end" title="값이 0.5 이상인 초">예(초)${ICON.ar}</button></div><div class="qbody"></div>`;
  const qbody = $(".qbody", pq);
  const qrows = qs.map(q => {
    const r = document.createElement("div"); r.className = "qrow qg"; r.tabIndex = 0; r.setAttribute("role", "button");
    const crit = q.type === "noul" ? [["예", q.criteria?.true], ["아니오", q.criteria?.false]] : (q.criteria || []).map((c, n) => [n + "점", c]);
    const critHtml = crit.some(c => c[1]) ? `<ul class="crit">${crit.map(c => `<li><b>${c[0]}</b><span>${esc(c[1] || "")}</span></li>`).join("")}</ul>` : `<ul class="crit"><li style="display:block">기준 글 없이 요청에 맞는지만 묻습니다.</li></ul>`;
    r.innerHTML = `<span style="min-width:0"><span class="qkey">${q.vague ? "worth" : esc(q.key)}<span class="tag">${q.vague ? "막연한 질문 · 반반 합침" : q.type === "noul" ? "예 / 아니오" : `0–${(q.criteria?.length || 1) - 1}점`}</span></span><p class="qtext">${esc(q.text)}</p><canvas></canvas></span>
      <span class="n">${q.mean.toFixed(2)}</span><span class="n">${q.peak.toFixed(2)}</span><span class="n">${q.yes_seconds}</span>
      <div class="qmore"><div>${critHtml}</div></div>`;
    r.onclick = () => r.classList.toggle("open");
    r.onkeydown = e => { if (e.key === "Enter") r.classList.toggle("open"); };
    r._q = q; qbody.append(r); return r;
  });
  function drawSparks() {
    if (!drawer.classList.contains("open") || pq.hidden) return;
    const col = css("--series"), rgb = css("--series-rgb"), mk = css("--mark-soft");
    qrows.forEach(r => { const cv = $("canvas", r), q = r._q, [g, w, h] = fit(cv, 22), n = q.series.length;
      if (!w) return;
      g.fillStyle = mk; for (const c of hits) g.fillRect(c.start / D * w, 0, Math.max(1, (c.end - c.start) / D * w), h);
      g.beginPath(); g.moveTo(0, h); for (let k = 0; k < n; k++) g.lineTo(d.t[k] / D * w, h - 1 - q.series[k] * (h - 3)); g.lineTo(w, h); g.closePath(); g.fillStyle = `rgba(${rgb},.2)`; g.fill();
      g.beginPath(); for (let k = 0; k < n; k++) { const X = d.t[k] / D * w, Y = h - 1 - q.series[k] * (h - 3); k ? g.lineTo(X, Y) : g.moveTo(X, Y); } g.strokeStyle = col; g.lineWidth = 1.2; g.stroke(); });
  }
  $(".thead", pq).onclick = e => { const b = e.target.closest("button[data-k]"); if (!b) return; const k = b.dataset.k; P.sortQ = { k, asc: P.sortQ?.k === k ? !P.sortQ.asc : false };
    $$(".thead button", pq).forEach(x => { x.classList.toggle("sorted", x === b); x.classList.toggle("asc", P.sortQ.asc); });
    flip(qbody, () => [...qrows].sort((a, b2) => (a._q[k] - b2._q[k]) * (P.sortQ.asc ? 1 : -1)).forEach(r => qbody.append(r))); };

  /* ----- 근거: 기록 ----- */
  const pl = $('.pane[data-p="log"]', st), jd = d.judge || {}, co = d.costs || {}, steps = (d.steps || []).filter(s => s.started && s.ended), mx = Math.max(1, ...steps.map(s => s.ended - s.started));
  const dimtx = s => `<span style="color:var(--ink3)">${s}</span>`;
  const kv = rows => `<dl class="kv">${rows.filter(r => r[1] != null && r[1] !== "").map(r => `<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join("")}</dl>`;
  pl.innerHTML = `
    ${steps.length ? `<div class="sec"><span class="lab">단계마다 걸린 시간 · 모두 ${secs(d.elapsed)}</span><div class="durs">${steps.map(s => `<div><span>${esc(s.label.replace(/ ·.*/, ""))}</span><i style="width:${Math.max(1.5, (s.ended - s.started) / mx * 100)}%"></i><span>${secs(s.ended - s.started)}</span></div>`).join("")}</div></div>` : ""}
    <div class="sec"><span class="lab">질문 쓰기</span>${kv([["쓴 쪽", esc(wr.model || "–")], ["검색어", (wr.search_queries || []).map(esc).join("<br>") || (wr.understanding ? "검색하지 않음" : null)], ["참고한 곳", (wr.sources || []).map(esc).join(", ")], ["판정 모델에 준 요청", esc(d.viewer_request || "")], ["값", wr.usage ? `${usd(wr.usage.usd_estimate)} ${dimtx(`(입력 ${(wr.usage.prompt || 0).toLocaleString()} · 출력과 생각 ${((wr.usage.output || 0) + (wr.usage.thoughts || 0)).toLocaleString()} 토큰)`)}` : null]])}</div>
    <div class="sec"><span class="lab">판정</span>${kv([["모델", "H2O-Lightning-4B" + (jd.fake ? " (흉내: 받아 둔 답)" : "")], ["물은 곳", jd.requests != null ? `${jd.requests.toLocaleString()}곳 · 오류 ${jd.errors ?? 0}` : `${d.positions.toLocaleString()}곳`], ["빠르기", jd.rate_per_second ? `초당 ${jd.rate_per_second}곳` : null], ["서버 준비", jd.ready_seconds ? secs(jd.ready_seconds) : null], ["값 (어림)", co.h2o_usd != null ? `${usd(co.h2o_usd)} ${dimtx(`(GPU ${secs(co.h2o_seconds)})`)}` : null]])}</div>
    ${d.verify ? `<div class="sec"><span class="lab">다시 확인</span>${kv([["본 쪽", vf ? esc(vf.model || "") : null], ["후보", vf ? `${vf.candidates}개 가운데 ${vf.matched}개 통과 (확률 ${vf.keep_p} 이상)` : null], ["하지 못함", vf ? null : esc(d.verify.reason || "")], ["값", vf?.usage ? `${usd(vf.usage.usd_estimate)} ${dimtx(`(입력 ${(vf.usage.prompt || 0).toLocaleString()} · 출력과 생각 ${((vf.usage.output || 0) + (vf.usage.thoughts || 0)).toLocaleString()} 토큰)`)}` : null]])}</div>` : ""}
    <div class="sec"><span class="lab">점수와 클립 규칙</span>${kv([["합치는 식", d.combine === "value_mean" ? "기준 질문의 평균과 막연한 질문을 영상 안 순위로 반반" : esc(d.combine || "")], ["후보", vf ? `합친 점수, 질문 하나하나, 막연한 질문에서 돌아가며 ${vf.candidates}개` : null], ["예산", d.params && !vf ? `영상의 ${(d.params.budget * 100).toFixed(0)}%에서 멈춤` : null], ["앞뒤 여유", d.params ? `앞 ${d.params.pre}초 · 뒤 ${d.params.post}초` : null], ["길이", d.params ? `${d.params.min_len}초 이상 · 한 대목은 ${d.params.hard_max}초까지` : null], ["영상", `${ms(D)} · ${d.size?.[0]}×${d.size?.[1]}${d.fps ? ` · ${d.fps}fps` : ""} · 1초마다 ${d.positions.toLocaleString()}곳`]])}</div>
    ${wr.limits ? `<div class="sec"><span class="lab">질문을 쓴 LLM이 적은 한계</span><p>${esc(wr.limits)}</p></div>` : ""}`;

  /* ----- 근거: 다시 확인 ----- */
  const pv = $('.pane[data-p="vf"]', st);
  if (pv) {
    pv.innerHTML = !vf ? `<div class="sec"><span class="lab">다시 확인</span><p>확인하지 못했습니다. 지금 보이는 클립은 확인 전의 것입니다.</p><p style="margin-top:6px;color:var(--ink3)">${esc(d.verify.reason || "")}</p></div>` : `
      ${vf.note ? `<div class="sec"><span class="lab">Gemini가 후보를 보고 적은 것</span><p>${esc(vf.note)}</p></div>` : ""}
      <div class="sec"><span class="lab">후보 ${vf.candidates}개 · 확률 ${vf.keep_p} 이상이면 고른 클립</span><div class="vlist">${[...clips].sort((a, b) => b.p - a.p).map(c => `<button class="vrow${isHit(c) ? "" : " low"}" data-r="${c.rank}"><span class="mono">${ms(c.start)}–${ms(c.end)}</span><u><i style="width:${c.p * 100}%"></i></u><em class="mono">${c.p.toFixed(2)}</em><p>${esc(c.see)}</p><small>${esc(c.from)}에서 나온 후보</small></button>`).join("")}</div></div>
      ${vf.by === "h2o" && vf.question ? `<div class="sec"><span class="lab">확인 질문</span><p>${esc(vf.question.instructions || "")}</p><p style="margin-top:6px;color:var(--ink3)">예: ${esc(vf.question.criteria?.true || "")}</p><p style="margin-top:4px;color:var(--ink3)">아니오: ${esc(vf.question.criteria?.false || "")}</p>${vf.question.options ? `<p style="margin-top:8px">고르기 질문의 선택지</p>${vf.question.options.map((o, i) => `<p style="margin-top:4px;color:var(--ink3)">${i === 0 ? "찾는 장면" : (o.key === "none_of_these" ? "어느 것도 아님" : "헷갈리는 것")}: ${esc(o.is)}</p>`).join("")}` : ""}</div>` : ""}
      <div class="sec"><span class="lab">어떻게 확인했나</span><p>${vf.by === "h2o"
        ? `판정 모델이 고른 후보마다 프레임 8장(가장 확신한 1초의 연속 4장, 구간 전체에서 고르게 4장)을 4장씩 두 번, 같은 판정 모델에 위의 확인 질문으로 다시 묻고 두 답을 평균했습니다.${vf.rule === "both" ? ` 같은 프레임에 "찾는 장면, 헷갈리는 장면들, 어느 것도 아님" 가운데 하나를 고르는 질문도 함께 물어(선택지 순서를 바꿔 두 번), 예/아니오의 값과 찾는 장면이 받은 확률이 둘 다 ${vf.keep_p} 이상일 때만 통과시켰습니다. 값은 둘 중 작은 쪽입니다.` : ""} 확인 질문은 ${esc((vf.question?.writer || "Gemini").replace(/\s*\(.*/, ""))}이(가) 요청만 보고 썼습니다(영상과 프레임은 보지 않음). 프레임은 판정 모델 밖으로 나가지 않았습니다. 프레임에 안 잡힌 짧은 순간은 놓칠 수 있습니다.`
        : `판정 모델이 고른 후보마다 프레임 8장(가장 확신한 1초의 연속 4장, 구간 전체에서 고르게 4장)을 Gemini에 주고 요청한 장면이 담겼을 확률을 받았습니다. 판정 모델의 질문과 답은 주지 않았습니다. 프레임에 안 잡힌 짧은 순간은 놓칠 수 있습니다.`}</p></div>`;
    pv.onclick = e => { const b = e.target.closest(".vrow"); if (!b) return; const c = clips.find(c => c.rank === +b.dataset.r); drawer._close(); seek(c.start, true); };
  }

  /* ----- 근거 여닫기와 탭 ----- */
  const ink = $(".tab-ink", st);
  function tab(p, first) {
    $$(".tabs button", st).forEach(b => { const on = b.dataset.p === p; b.setAttribute("aria-selected", on); if (on) { ink.style.left = b.offsetLeft + 8 + "px"; ink.style.width = b.offsetWidth - 16 + "px"; } });
    $$(".pane", st).forEach(x => { const on = x.dataset.p === p; x.hidden = !on; x.classList.toggle("show", on && !first); });
    if (p === "qs") drawSparks();
  }
  const openDrawer = on => { drawer.classList.toggle("open", on); scrim.classList.toggle("on", on); if (on) { tab($('.tabs button[aria-selected="true"]', st)?.dataset.p || "qs", true); setTimeout(drawSparks, 80); } };
  drawer._close = () => openDrawer(false);
  $("#bWhy", st).onclick = () => openDrawer(true); $("#bClose", st).onclick = () => openDrawer(false); scrim.onclick = () => openDrawer(false);
  $(".tabs", st).onclick = e => { const b = e.target.closest("button"); if (b) tab(b.dataset.p); };

  /* ----- 키 ----- */
  const onKey = e => {
    if (e.target.closest("textarea,input") || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === " ") { if (e.target.closest("button,a,[role=button]")) return; e.preventDefault(); toggle(); }
    else if (k === "ArrowLeft") { e.preventDefault(); seek(timeNow() - (e.shiftKey ? 5 : 1)); }
    else if (k === "ArrowRight") { e.preventDefault(); seek(timeNow() + (e.shiftKey ? 5 : 1)); }
    else if (k === "ArrowUp") { e.preventDefault(); goClip(-1); }
    else if (k === "ArrowDown") { e.preventDefault(); goClip(1); }
    else if (k === "h" || k === "H" || k === "ㅗ") setReel(!P.reel);
    else if (k === "m" || k === "M" || k === "ㅡ") setMute(!video.muted);
    else if (/^[1-9]$/.test(k)) { const c = clips.find(c => c.rank === +k); if (c) seek(c.start, true); }
  };
  addEventListener("keydown", onKey);
  requestAnimationFrame(loop);
  paint(); drawAll();
  if (first) video.addEventListener("loadedmetadata", () => { if (P.mode === "source" && video.currentTime === 0) seek(first.start); }, { once: true });
  return { destroy() { P.dead = true; ro.disconnect(); removeEventListener("keydown", onKey); video.pause(); video.removeAttribute("src"); video.load(); }, repaint: drawAll };
}

tick();
setInterval(renderBar, 1000);
</script>
